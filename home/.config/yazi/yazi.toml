[mgr]
ratio = [1, 3, 3]
show_hidden = true

[opener]
play = [
	{ run = "xdg-open %s1", orphan = true, for = "unix" },
]
edit = [
	{ run = "$EDITOR %s", block = true, for = "unix" },
]
open = [
	{ run = "xdg-open %s1", desc = "Open", for = "unix" },
]

[plugin]
